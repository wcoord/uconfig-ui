<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>uConfig UI</title>
    <script>
      // Apply the saved/system theme before first paint, and advertise only the
      // active scheme so dark-system browsers don't force-dark our light theme.
      try {
        var s = JSON.parse(localStorage.getItem('uconfig-ui') || '{}')
        var dark = s.theme ? s.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        var scheme = dark ? 'dark' : 'light'
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = scheme
        document.querySelector('meta[name="color-scheme"]').content = scheme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
